<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lot Review Dashboard</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <h1>Lot Review Dashboard</h1>
        <p>AsBuilt ISO Review Status</p>
    </header>
    <main>
        <section id="lot1">
            <h2>Lot 1</h2>
            <table>
                <thead>
                    <tr>
                        <th>Assigned To</th>
                        <th>Total</th>
                        <th>Closed</th>
                        <th>Open</th>
                        <th>Hold</th>
                    </tr>
                </thead>
                <tbody id="lot1-table"></tbody>
            </table>
        </section>
        <section id="lot2">
            <h2>Lot 2</h2>
            <table>
                <thead>
                    <tr>
                        <th>Assigned To</th>
                        <th>Total</th>
                        <th>Closed</th>
                        <th>Open</th>
                        <th>Hold</th>
                    </tr>
                </thead>
                <tbody id="lot2-table"></tbody>
            </table>
        </section>
    </main>
    <script src="scripts/dashboard.js"></script>
</body>
</html>
